      - { hold: bulk, max_lb: 9000, ratio: 2 }        # estimate

  - name: 777F Freighter
    type: 777F
    limits: { min_runway_ft: 10000, mlw_lb: 575000, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 228700 }   # estimate
    holds:
      - { hold: main_deck, max_lb: 180000, ratio: 40 }   # estimate
      - { hold: forward, max_lb: 40000, ratio: 10 }      # estimate
      - { hold: aft, max_lb: 32000, ratio: 8 }           # estimate
      - { hold: bulk, max_lb: 9000, ratio: 2 }           # estimate
