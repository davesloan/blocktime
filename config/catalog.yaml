# BlockTime aircraft catalog (design.md §3, D-091).
#
# Copy this file to %LOCALAPPDATA%\BlockTime\catalog.yaml. The app reads that copy.
#
# Two lists:
#   types      what a plane is. Reference data: edits apply to every airplane of the type (D-093).
#              sim_folder is the folder of the variant's aircraft.cfg in the sim. The matching check compares
#              it with the loaded aircraft (D-112): that folder, or one starting with it plus a space
#              ("PMDG 777-200ER GE"). Liveries point at their variant's folder, so every livery matches.
#   airframes  templates: a type in one configuration. When an airplane is leased, its airframe's seats and holds
#              and its type's lease rate are copied into the database, and later edits here don't change it (D-082).
#
# Money is in whole dollars (multiples of $5). Weights are in pounds.
#
# Each airframe's limits (D-100) are what New Flight needs before a SimBrief plan exists: the minimum runway, MLW,
# passenger and bag weight, and max payload (MZFW - empty weight). They're defaults: an airplane in airline.yaml can
# override any of them. They must match the airplane's SimBrief airframe.
# Numbers marked "estimate" are placeholders until they're read from the PMDG load pages (design.md §17).

types:
  - code: 737-600
    family: "737"
    role: airliner            # airliner | executive | freighter
    turnaround_min: 35
    cruise_speed_kt: 450      # estimate
    lease_per_month: 750000
    sim_folder: PMDG 737-600

  - code: 737-800
    family: "737"
    role: airliner
    turnaround_min: 35
    cruise_speed_kt: 450      # estimate
    lease_per_month: 1400000
    sim_folder: PMDG 737-800

  - code: 737-800 BBJ2
    family: "737"
    role: executive           # VIP airliner or charter, never belly cargo (D-089)
    turnaround_min: 35
    cruise_speed_kt: 450      # estimate
    lease_per_month: 900000
    sim_folder: PMDG 737-800BBJ2

  - code: 737-800 BCF
    family: "737"
    role: freighter
    turnaround_min: 35
    cruise_speed_kt: 450      # estimate
    lease_per_month: 500000
    sim_folder: PMDG 737-800BCF

  - code: 777-200ER
    family: "777"
    role: airliner
    turnaround_min: 60
    cruise_speed_kt: 490      # estimate
    lease_per_month: 1900000
    sim_folder: PMDG 777-200ER

  - code: 777-300ER
    family: "777"
    role: airliner
    turnaround_min: 60
    cruise_speed_kt: 490      # estimate
    lease_per_month: 2300000
    sim_folder: PMDG 777-300ER

  - code: 777F
    family: "777"
    role: freighter
    turnaround_min: 60
    cruise_speed_kt: 490      # estimate
    lease_per_month: 3000000
    sim_folder: PMDG 777F

airframes:
  - name: 737-600 Two-class
    type: 737-600
    limits: { min_runway_ft: 6000, mlw_lb: 120500, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 33800 }   # estimate
    cabins: { business: 8, economy: 104 }       # estimate: design.md §3 says ~112 seats
    holds:
      - { hold: forward, max_lb: 5000, ratio: 4 }   # estimate
      - { hold: aft, max_lb: 6300, ratio: 5 }       # estimate

  - name: 737-600 All-economy
    type: 737-600
    limits: { min_runway_ft: 6000, mlw_lb: 120500, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 33800 }   # estimate
    cabins: { economy: 130 }                    # estimate: design.md §3 says ~130 seats
    holds:
      - { hold: forward, max_lb: 5000, ratio: 4 }   # estimate
      - { hold: aft, max_lb: 6300, ratio: 5 }       # estimate

  - name: 737-800 Two-class
    type: 737-800
    limits: { min_runway_ft: 7000, mlw_lb: 146300, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 47000 }   # estimate
    cabins: { business: 16, economy: 144 }      # estimate: design.md §3 says ~160 seats
    holds:
      - { hold: forward, max_lb: 7500, ratio: 4 }   # estimate
      - { hold: aft, max_lb: 9500, ratio: 5 }       # estimate

  - name: 737-800 All-economy
    type: 737-800
    limits: { min_runway_ft: 7000, mlw_lb: 146300, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 47000 }   # estimate
    cabins: { economy: 184 }                    # estimate: design.md §3 says ~184 seats
    holds:
      - { hold: forward, max_lb: 7500, ratio: 4 }   # estimate
      - { hold: aft, max_lb: 9500, ratio: 5 }       # estimate

  - name: 737-800 BBJ2 VIP
    type: 737-800 BBJ2
    limits: { min_runway_ft: 7000, mlw_lb: 146300, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 36113 }   # from N814SX's SimBrief airframe
    cabins: { economy: 48 }    # 48 VIP seats; the VIP fare is per seat whatever the class (design.md §12)
    holds:   # bags only. 17,645 lb = SimBrief's max cargo, split 4:5 forward:aft; both checked by Dave in the sim
             # (docs/notes/simbrief-airframes.md)
      - { hold: forward, max_lb: 7842, ratio: 4 }
      - { hold: aft, max_lb: 9803, ratio: 5 }

  - name: 737-800 BCF Freighter
    type: 737-800 BCF
    limits: { min_runway_ft: 7000, mlw_lb: 146300, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 52000 }   # estimate
    holds:
      - { hold: main_deck, max_lb: 40000, ratio: 20 }   # estimate
      - { hold: forward, max_lb: 7500, ratio: 4 }       # estimate
      - { hold: aft, max_lb: 9500, ratio: 5 }           # estimate

  - name: 777-200ER Standard
    type: 777-200ER
    limits: { min_runway_ft: 9000, mlw_lb: 470000, passenger_weight_lb: 190, bag_weight_lb: 55, max_payload_lb: 135500 }   # estimate
